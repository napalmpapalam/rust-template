version: 2

updates:
  # One grouped PR a week, not one per crate.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
{% if docker %}
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
{% endif %}
