# The wizard. `cargo generate --git <this repo> template` reads this file, asks
# the questions below, then renders the rest of this directory with the answers.

[template]
cargo_generate_version = ">=0.22.0"
# GitHub Actions expressions use `${{ ... }}` — the same delimiters liquid
# does. These files are copied verbatim so the expressions survive.
exclude = [".github/workflows/**"]

[placeholders]

[placeholders.description]
type = "string"
prompt = "One line — what does it do?"
default = "A Rust service"

[placeholders.server]
type = "bool"
prompt = "HTTP server (axum, health/ready probes, graceful shutdown)?"
default = true

[placeholders.license]
type = "string"
prompt = "License"
choices = ["MIT", "Apache-2.0", "MIT OR Apache-2.0", "none"]
default = "MIT"

[placeholders.ci]
type = "string"
prompt = "CI"
choices = ["github", "gitlab", "none"]
default = "github"

[placeholders.docker]
type = "bool"
prompt = "Multi-stage Dockerfile (cargo-chef) + .dockerignore?"
default = true

[placeholders.githooks]
type = "bool"
prompt = "Pre-commit hook (fmt + clippy)?"
default = true

[placeholders.claude]
type = "bool"
prompt = "CLAUDE.md + .claude/settings.json?"
default = true

[hooks]
post = ["post-script.rhai"]
