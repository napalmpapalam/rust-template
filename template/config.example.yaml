# Example configuration for {{project-name}}.
#
# Copy to ./config.yaml, or point at it with {{crate_name | upcase}}_CONFIG.
# Every value here is a default, so an empty file boots — uncomment only what
# you change.
#
# Env vars override the file, `__` separating the nesting:
# {{crate_name | upcase}}__LOG__FORMAT=json. An unknown key fails at boot.
#
# `{{project-name}} config` prints what the layers merged to.

# log:
#   # Tracing directives: "info", or "info,{{crate_name}}=debug".
#   filter: "info"
#
#   # "text" for humans, "json" for log collectors.
#   format: "text"
{% if server %}
# server:
#   bind_addr: "0.0.0.0:8080"
{% endif %}
